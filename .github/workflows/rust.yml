name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
    - uses: actions/checkout@v6
    - name: Select Rust toolchain
      run: rustup default stable-x86_64-pc-windows-msvc
    - name: Build
      run: cargo build --locked --release
    - name: Run tests
      # These two tests require an interactive desktop or a physical camera.
      run: cargo test --locked --release -- --skip desktop_capture_delivers_frames --skip first_camera_delivers_frames
