[package]
name = "livemix"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = "1"
eframe = "0.31"
fontdb = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "gif"] }
roxmltree = "0.21"
serde_json = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
# Media Foundation: cameras / capture cards (incl. Blackmagic WDM devices), video files,
# MP4 recording; plus the Windows file picker.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1
